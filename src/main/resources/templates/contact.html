<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Contact</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex flex-col min-h-screen bg-gray-50 text-gray-800">

<nav th:replace="~{fragments/layout :: nav}"></nav>

<main class="flex-grow container mx-auto px-6 py-8 max-w-xl">

    <h1 class="text-3xl font-bold mb-8">Contact</h1>

    <!-- Bevestigingsboodschap na verzenden -->
    <div th:if="${param.verzonden}"
         class="bg-green-100 text-green-700 border border-green-300 rounded p-4 mb-6">
        Je bericht werd succesvol verzonden!
    </div>

    <!-- Foutboodschap -->
    <div th:if="${param.fout}"
         class="bg-red-100 text-red-700 border border-red-300 rounded p-4 mb-6">
        Er liep iets fout. Probeer opnieuw.
    </div>

    <div class="bg-white rounded shadow p-6">
        <form action="/contact" method="post">

            <div class="mb-4">
                <label for="name" class="block text-sm font-medium mb-1">Naam</label>
                <input id="name" type="text"
                       name="naam"
                       required
                       class="border w-full p-2 rounded focus:outline-none focus:ring-2 focus:ring-green-500"/>
            </div>

            <div class="mb-4">
                <label for="email" class="block text-sm font-medium mb-1">E-mailadres</label>
                <input id="email" type="email"
                       name="email"
                       required
                       class="border w-full p-2 rounded focus:outline-none focus:ring-2 focus:ring-green-500"/>
            </div>

            <div class="mb-6">
                <label for="bericht" class="block text-sm font-medium mb-1">Bericht</label>
                <textarea id="bericht" name="bericht"
                          rows="5"
                          required
                          class="border w-full p-2 rounded focus:outline-none focus:ring-2 focus:ring-green-500"></textarea>
            </div>

            <button type="submit"
                    class="w-full bg-blue-700 text-white py-2 rounded hover:bg-green-800 transition">
                Verstuur bericht
            </button>

        </form>
    </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

</body>
</html>
