
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: pagina(~{::title}, ~{::main})}">
<head>
    <title th:text="'Homepage | Anderlecht NGO'">Index | Anderlecht NGO</title>
</head>
<body>
<main>
    <div class="max-w-4xl mx-auto px-6 py-8">
        <div class="flex items-center justify-between mb-8">
            <div>
                <p class="text-xs text-gray-400 uppercase tracking-widest mb-1">Anderlecht NGO</p>
                <h1 class="text-2xl font-medium">Evenementen</h1>
            </div>
            <a href="/new" class="inline-flex items-center gap-2 bg-green-700 text-white px-4 py-2 rounded-lg text-sm hover:bg-green-800">
                + Nieuw evenement
            </a>
        </div>

        <div class="border border-gray-100 rounded-xl overflow-hidden">
            <div class="grid grid-cols-[1fr_1fr_auto] bg-gray-50 px-4 py-2.5 gap-3">
                <span class="text-xs text-gray-400 uppercase tracking-wider">Titel</span>
                <span class="text-xs text-gray-400 uppercase tracking-wider">Organisatie</span>
                <span></span>
            </div>

            <div th:each="e : ${evenementen}"
                 class="grid grid-cols-[1fr_1fr_auto] bg-white px-4 py-3.5 gap-3 items-center border-t border-gray-50 hover:bg-gray-50 transition-colors">
                <div class="flex items-center gap-2.5">
                    <div class="w-1.5 h-1.5 rounded-full bg-green-600 shrink-0"></div>
                    <span class="text-sm" th:text="${e.titel}"></span>
                </div>
                <span class="text-sm text-gray-500" th:text="${e.organisatie}"></span>
                <a th:href="@{/detail/{id}(id=${e.id})}"
                   class="text-xs text-green-700 hover:underline flex items-center gap-1 whitespace-nowrap">
                    Details →
                </a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
