<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: pagina(~{::title}, ~{::main})}">
<head>
    <title th:text="'Nieuw evenement | Anderlecht NGO'">Nieuw evenement | Anderlecht NGO</title>
</head>
<body>
<main>
    <div class="max-w-lg mx-auto px-6 py-8">
        <h1 class="text-2xl font-bold mb-4">Nieuw evenement</h1>

        <form th:action="@{/new}" th:object="${evenement}" method="post" class="space-y-4">

            <div>
                <label for="titel">Titel</label>
                <input id="titel" type="text" th:field="*{titel}" class="border w-full p-2 rounded" required/>
                <p th:if="${#fields.hasErrors('titel')}" th:errors="*{titel}" class="text-red-500 text-sm"></p>
            </div>

            <div>
                <label for="omschrijving">Omschrijving</label>
                <textarea th:field="*{omschrijving}" id="omschrijving" class="border w-full p-2 rounded" required></textarea>
                <p th:if="${#fields.hasErrors('omschrijving')}" th:errors="*{omschrijving}" class="text-red-500 text-sm"></p>
            </div>

            <div>
                <label for="date">Tijdstip</label>
                <input id="date" type="datetime-local" th:field="*{tijdstip}" class="border w-full p-2 rounded" required/>
                <p th:if="${#fields.hasErrors('tijdstip')}" th:errors="*{tijdstip}" class="text-red-500 text-sm"></p>
            </div>

            <div>
                <label for="organisatie">Organisatie</label>
                <input id="organisatie" type="text" th:field="*{organisatie}" class="border w-full p-2 rounded" required/>
                <p th:if="${#fields.hasErrors('organisatie')}" th:errors="*{organisatie}" class="text-red-500 text-sm"></p>
            </div>

            <div>
                <label for="mail_contact">Mail contactpersoon</label>
                <input id="mail_contact" type="email" th:field="*{mailContactpersoon}" class="border w-full p-2 rounded" required/>
                <p th:if="${#fields.hasErrors('mailContactpersoon')}" th:errors="*{mailContactpersoon}" class="text-red-500 text-sm"></p>
            </div>

            <div>
                <label for="locatie">Locatie</label>
                <select id="locatie" th:field="*{locatie}" class="border w-full p-2 rounded" required>
                    <option value="">-- Kies een locatie --</option>
                    <option th:each="l : ${locaties}"
                            th:value="${l.id}"
                            th:text="${l.naam}"></option>
                </select>
                <p th:if="${#fields.hasErrors('locatie')}" th:errors="*{locatie}" class="text-red-500 text-sm"></p>
            </div>

            <button type="submit" class="bg-green-700 text-white px-4 py-2 rounded hover:bg-green-800">
                Opslaan
            </button>
        </form>
    </div>
</main>
</body>
</html>
