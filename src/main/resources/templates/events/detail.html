<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: pagina(~{::title}, ~{::main})}">
<head>
    <title th:text="${evenement.titel + ' | Anderlecht NGO'}">Detail | Anderlecht NGO</title>
</head>
<body>
<main>
    <div class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-10">

        <!-- Back link -->
        <a th:href="@{/}" class="inline-flex items-center gap-1 text-green-600 hover:text-green-800 text-sm font-medium mb-6 transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            Terug naar overzicht
        </a>

        <!-- Main card -->
        <div class="card">
            <!-- Header banner -->
            <div class="bg-gradient-to-r from-green-700 to-green-900 px-6 py-8 text-white">
                <div class="flex flex-wrap gap-2 mb-3">
                    <span th:if="${evenement.organisatie == 'Eigen beheer'}"
                          class="bg-green-500 bg-opacity-40 text-green-100 text-xs font-semibold px-3 py-1 rounded-full">
                        Eigen beheer
                    </span>
                    <span th:unless="${evenement.organisatie == 'Eigen beheer'}"
                          class="bg-blue-500 bg-opacity-40 text-blue-100 text-xs font-semibold px-3 py-1 rounded-full"
                          th:text="${evenement.organisatie}">
                    </span>
                </div>
                <h1 class="text-2xl sm:text-3xl font-bold" th:text="${evenement.titel}">Titel</h1>
                <p class="mt-2 text-green-200 flex items-center gap-2">
                    <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                    <span th:text="${#temporals.format(evenement.tijdstip, 'EEEE d MMMM yyyy, HH:mm')}">
                        datum
                    </span>
                </p>
            </div>

            <!-- Details body -->
            <div class="px-6 py-6 space-y-6">

                <!-- Description -->
                <div>
                    <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Omschrijving</h2>
                    <p class="text-gray-700 leading-relaxed" th:text="${evenement.omschrijving}">Beschrijving</p>
                </div>

                <div class="border-t border-gray-100"></div>

                <!-- Info grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">

                    <!-- Organisatie -->
                    <div class="flex gap-3">
                        <div class="flex-shrink-0 w-10 h-10 bg-green-100 rounded-lg flex items-center justify-center">
                            <svg class="w-5 h-5 text-green-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-2 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/>
                            </svg>
                        </div>
                        <div>
                            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Organisatie</p>
                            <p class="mt-0.5 text-gray-800 font-medium" th:text="${evenement.organisatie}">Organisatie</p>
                        </div>
                    </div>

                    <!-- Contactpersoon -->
                    <div class="flex gap-3">
                        <div class="flex-shrink-0 w-10 h-10 bg-blue-100 rounded-lg flex items-center justify-center">
                            <svg class="w-5 h-5 text-blue-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                            </svg>
                        </div>
                        <div>
                            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Contactpersoon</p>
                            <a th:href="'mailto:' + ${evenement.mailContactpersoon}"
                               class="mt-0.5 text-green-600 hover:text-green-800 font-medium break-all transition-colors"
                               th:text="${evenement.mailContactpersoon}">
                                email
                            </a>
                        </div>
                    </div>

                    <!-- Locatie naam -->
                    <div class="flex gap-3">
                        <div class="flex-shrink-0 w-10 h-10 bg-orange-100 rounded-lg flex items-center justify-center">
                            <svg class="w-5 h-5 text-orange-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                        </div>
                        <div>
                            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Locatie</p>
                            <p class="mt-0.5 text-gray-800 font-medium" th:text="${evenement.locatie.naam}">Naam</p>
                            <p class="text-sm text-gray-500" th:text="${evenement.locatie.adres}">Adres</p>
                        </div>
                    </div>

                    <!-- Capaciteit -->
                    <div class="flex gap-3">
                        <div class="flex-shrink-0 w-10 h-10 bg-purple-100 rounded-lg flex items-center justify-center">
                            <svg class="w-5 h-5 text-purple-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                      d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
                            </svg>
                        </div>
                        <div>
                            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Capaciteit</p>
                            <p class="mt-0.5 text-gray-800 font-medium"
                               th:text="${evenement.locatie.capaciteit + ' personen'}">Capaciteit</p>
                        </div>
                    </div>

                </div>


            </div>
        </div>

    </div>
</main>
</body>
</html>
