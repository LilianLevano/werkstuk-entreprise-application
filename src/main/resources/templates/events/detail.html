
<!-- templates/index.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{fragments/layout :: pagina('Detail', ~{::main})}">
    <main class="flex flex-col flex-grow items-center mx-auto px-6 py-8">
        <!-- jouw inhoud hier -->

        <h1 class="text-2xl font-bold mb-6" th:text="${evenement.titel}">Titel</h1>

        <div class="bg-white rounded shadow p-6 max-w-xl space-y-4">

            <div>
                <p class="text-sm text-gray-500">Tijdstip</p>
                <p th:text="${#temporals.format(evenement.tijdstip, 'dd/MM/yyyy HH:mm')}"></p>
            </div>

            <div>
                <p class="text-sm text-gray-500">Omschrijving</p>
                <p th:text="${evenement.omschrijving}"></p>
            </div>

            <div>
                <p class="text-sm text-gray-500">Organisatie</p>
                <p th:text="${evenement.organisatie}"></p>
            </div>

            <div>
                <p class="text-sm text-gray-500">Mail contactpersoon</p>
                <p th:text="${evenement.mailContactpersoon}"></p>
            </div>

            <div>
                <p class="text-sm text-gray-500">Locatie</p>
                <p th:text="${evenement.locatie.naam}"></p>
                <p class="text-sm text-gray-400" th:text="${evenement.locatie.adres}"></p>
                <p class="text-sm text-gray-400">
                    Capaciteit:
                    <span th:text="${evenement.locatie.capaciteit}"></span> personen
                </p>
            </div>

        </div>

        <a href="/" class="mt-6 inline-block text-green-700 hover:underline">
            ← Terug naar overzicht
        </a>

    </main>
</div>
</body>
</html>
